plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'app.roadlog.dashcam'
    compileSdk 35

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    lint {
        disable "ExtraTranslation"
    }

    androidResources {
        generateLocaleConfig = true
    }

    splits {
        abi {
            enable true

            universalApk true
        }
    }

    defaultConfig {
        multiDexEnabled true
        applicationId "app.roadlog.dashcam"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
            "-P", "plugin:androidx.compose.compiler.plugins.kotlin:experimentalStrongSkipping=true"
        ]
    }
    buildFeatures {
        compose true
        buildConfig = true
        viewBinding = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation "androidx.compose.material:material-icons-extended:1.6.8"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    // Lets VideoRecorderService observe app foreground/background transitions
    // (ProcessLifecycleOwner) to show/hide the floating preview window (newFeat.md
    // Feature 2) — matches the version already pinned for lifecycle-runtime-ktx/
    // lifecycle-service above.
    implementation 'androidx.lifecycle:lifecycle-process:2.8.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation "androidx.navigation:navigation-compose:2.7.7"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.1'

    // NOTE: The original `com.arthenica:ffmpeg-kit-full-gpl` was pulled from Maven Central
    // in April 2025 when the upstream project was retired (see the arthenica/ffmpeg-kit repo).
    // A community fork (`com.antonkarpenko:ffmpeg-kit-full-gpl`) was tried as a stopgap, but
    // was rejected as an unacceptable supply-chain risk (brand-new individual-maintainer
    // namespace, no reputation signal, native prebuilt binaries in a camera/mic/location app).
    // Batch concatenation is now implemented with `androidx.media3:media3-transformer`
    // instead (see MediaConverter.kt) — officially maintained by Google/AndroidX, no
    // third-party native binary, no GPL/patent concerns, and it transmuxes (stream-copies)
    // same-format segments automatically instead of always re-encoding.
    implementation 'androidx.media3:media3-transformer:1.9.4'

    implementation "androidx.datastore:datastore-preferences:1.1.1"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1"


    implementation 'com.maxkeppeler.sheets-compose-dialogs:core:1.2.0'
    implementation 'com.maxkeppeler.sheets-compose-dialogs:duration:1.2.0'
    implementation 'com.maxkeppeler.sheets-compose-dialogs:list:1.2.0'
    implementation 'com.maxkeppeler.sheets-compose-dialogs:input:1.2.0'

    // camera-effects below (needed for the watermark CameraEffect/SurfaceProcessor,
    // §5.1) requires this whole CameraX stack. The actual current-stable line is 1.6.1
    // (§5.1's "verify at implementation time" instruction), but 1.5.x/1.6.x both require
    // AGP 8.6+ (1.6.x additionally requires compileSdk 36) — the same AGP-floor tradeoff
    // already hit and documented for media3-transformer in §13. 1.4.2 is the newest
    // patch that resolves against this project's current AGP 8.3.0/compileSdk 35;
    // revisit alongside that same AGP/compileSdk bump later.
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"

    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-effects:${camerax_version}"
}